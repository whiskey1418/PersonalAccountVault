<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14181F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Personal Account Vault</title>
<meta name="apple-mobile-web-app-title" content="Vault">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="tailwind.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: none; background: #14181F; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; }
  button { -webkit-user-select: none; user-select: none; }
  input, select { -webkit-user-select: text; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  #root { min-height: 100vh; min-height: 100dvh; }
  #boot {
    position: fixed; inset: 0; background: #14181F; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; z-index: 999; transition: opacity .4s ease;
  }
  #boot .mark {
    width: 56px; height: 56px; border-radius: 16px; background: #2DD4BF; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 22px; color: #14181F;
  }
  #boot .label { color: white; font-size: 15px; font-weight: 700; letter-spacing: .3px; }
  #boot .dots { display: flex; gap: 5px; }
  #boot .dots span { width: 6px; height: 6px; border-radius: 99px; background: #2DD4BF; opacity: .4; animation: pulse 1s infinite ease-in-out; }
  #boot .dots span:nth-child(2) { animation-delay: .15s; }
  #boot .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
  #boot .err {
    display: none; max-width: 280px; text-align: center; color: #C7CDD6; font-size: 13px; line-height: 1.5; margin-top: 4px;
  }
  #boot .retry {
    display: none; margin-top: 6px; background: #2DD4BF; color: #14181F; border: none; border-radius: 10px;
    padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="boot">
  <div class="mark">V</div>
  <div class="label">Vault</div>
  <div class="dots" id="boot-dots"><span></span><span></span><span></span></div>
  <div class="err" id="boot-err">This is taking longer than expected. Something failed to load.</div>
  <button class="retry" id="boot-retry" onclick="location.reload()">Retry</button>
</div>
<div id="root"></div>

<script>
  window.__bootTimer = setTimeout(function () {
    var dots = document.getElementById("boot-dots");
    var err = document.getElementById("boot-err");
    var retry = document.getElementById("boot-retry");
    if (dots) dots.style.display = "none";
    if (err) err.style.display = "block";
    if (retry) retry.style.display = "inline-block";
  }, 6000);

  window.addEventListener("error", function (e) {
    var err = document.getElementById("boot-err");
    if (err && document.getElementById("boot")) {
      err.textContent = "Couldn't load the app (" + (e.message || "script error") + ").";
    }
  });
</script>

<script src="app.bundle.js"></script>

<script>
  var boot = document.getElementById("boot");
  if (boot) {
    clearTimeout(window.__bootTimer);
    boot.style.opacity = "0";
    setTimeout(function () { boot.remove(); }, 400);
  }
</script>
</body>
</html>
